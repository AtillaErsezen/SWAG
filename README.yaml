project:
  name: SWAG
  full_name: Safe Walk Augmented Generation
  tagline: Multilingual AI safety co-pilot for heavy machinery operators
  version: "1.0"

# ─────────────────────────────────────────────
#  WHAT IT DOES
# ─────────────────────────────────────────────
purpose: >
  SWAG delivers real-time, context-aware safety guidance to field operators
  working with heavy machinery. Workers can ask questions by voice or text
  in their native language and receive classified safety responses —
  DANGER, WARNING, or INSTRUCTION — backed by a RAG pipeline over
  ingested safety manuals.

# ─────────────────────────────────────────────
#  ARCHITECTURE AT A GLANCE
# ─────────────────────────────────────────────
#
#   [User Input]  voice / text / image
#        │
#        ▼
#   [Whisper STT]  →  raw transcript
#        │
#        ▼
#   [NLLB-200]  →  translated to English
#        │
#        ▼
#   [ChromaDB RAG]  →  top-k safety chunks
#        │
#        ▼
#   [Llama 3 LLM]  →  grounded response
#        │
#        ▼
#   [Classifier]  →  DANGER / WARNING / INSTRUCTION
#        │
#        ▼
#   [NLLB-200]  →  back to user's language
#        │
#        ▼
#   [gTTS + UI]  →  voice + text output
#
architecture:
  pipeline:
    - step: "Speech-to-Text"
      component: OpenAI Whisper
      purpose: Transcribe operator voice queries

    - step: "Translation (in)"
      component: Meta NLLB-200
      purpose: Convert any of 9 supported languages → English

    - step: "Semantic Retrieval"
      component: ChromaDB + sentence-transformers
      purpose: Retrieve top-k relevant safety manual chunks

    - step: "Response Generation"
      component: Llama 3 via Ollama
      purpose: Generate grounded, context-aware safety answer

    - step: "Classification"
      component: Custom classifier (pipeline/)
      purpose: Tag response as DANGER / WARNING / INSTRUCTION

    - step: "Translation (out)"
      component: Meta NLLB-200
      purpose: Translate answer back to operator's language

    - step: "Output"
      component: gTTS + Flask/Streamlit UI
      purpose: Deliver response as voice and text

# ─────────────────────────────────────────────
#  SAFETY TIERS
# ─────────────────────────────────────────────
safety_classification:
  - tier: DANGER
    symbol: "[ !! ]"
    description: Immediate life-threatening hazard — stop all activity
    color_code: red

  - tier: WARNING
    symbol: "[ !  ]"
    description: Potential injury risk — proceed with caution
    color_code: orange

  - tier: INSTRUCTION
    symbol: "[  i ]"
    description: Standard operating procedure or informational guidance
    color_code: blue

# ─────────────────────────────────────────────
#  TECH STACK
# ─────────────────────────────────────────────
stack:
  language: Python 3
  ai_models:
    llm: Llama 3 (via Ollama, local inference)
    stt: OpenAI Whisper
    translation: Meta NLLB-200
    embeddings: HuggingFace sentence-transformers
    object_detection: Roboflow / YOLO
    video_generation: Wan 2.2 (Diffusers)

  databases:
    vector_store: ChromaDB (persistent, swag_db/)
    audit_log: SQLite (training_audit.db)
    rules_store: JSON (output/all_classified.json)

  interfaces:
    rest_api: Flask 3.0+
    mobile_pwa: Streamlit
    cli: Terminal

  infrastructure:
    compute: CPU-optimized (PyTorch CPU wheels)
    tts: gTTS
    framework: LangChain

# ─────────────────────────────────────────────
#  LANGUAGE SUPPORT
# ─────────────────────────────────────────────
languages_supported:
  count: 9
  model: Meta NLLB-200 (3.3B params)
  note: All processing happens in English internally; NLLB handles I/O translation

# ─────────────────────────────────────────────
#  PROJECT STRUCTURE
# ─────────────────────────────────────────────
structure:
  pipeline/:   "Classifier, director (visual prompt builder), and ingestion modules"
  swag_db/:    "Persisted ChromaDB vector embeddings of safety manuals"
  output/:     "Classified safety rules (JSON) and archived manuals (Markdown)"
  dataset/:    "Raw training data"
  weights/:    "Fine-tuned model weights"
  model_history/: "Training run artifacts and metrics"

# ─────────────────────────────────────────────
#  KEY FEATURES
# ─────────────────────────────────────────────
features:
  - Multimodal input: voice, text, and image queries
  - Real-time RAG over ingested safety documentation
  - 3-tier safety classification with confidence scoring
  - 9-language support via neural machine translation
  - AI-generated safety demonstration videos
  - Operator interaction audit trail for continuous improvement
  - Runs fully offline on CPU hardware (no GPU required)
  - PWA-ready mobile interface for field use

# ─────────────────────────────────────────────
#  QUICK START
# ─────────────────────────────────────────────
quickstart:
  prerequisites:
    - Python 3.10+
    - Ollama with Llama 3 pulled (`ollama pull llama3`)
    - Dependencies: `pip install -r requirements.txt`

  run:
    api:   "python app.py"
    ui:    "streamlit run streamlit_app.py"
    cli:   "python main.py"

